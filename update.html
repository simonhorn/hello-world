<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8a1538">
  <title>Updating Heart Monitor</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#1f2328;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:520px;background:white;border-radius:18px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
    h1{margin-top:0;color:#8a1538}
    p{line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <h1>Updating Heart Monitor…</h1>
    <p>Your saved event records are not being deleted. This only clears the app's cached program files so the newest version can load.</p>
    <p id="status">Refreshing…</p>
  </div>
  <script>
    (async function(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        document.getElementById('status').textContent = 'Update cache cleared. Loading the newest app…';
      } catch (e) {
        document.getElementById('status').textContent = 'Refreshing the app…';
      }
      setTimeout(function(){
        location.replace('./?force=' + Date.now());
      }, 700);
    })();
  </script>
</body>
</html>
